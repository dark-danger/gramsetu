name: gramsetu_ai
description: 100% Offline Rural Multi-Modal AI Assistant powered by Qwen 2.5 and Local Engine.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.1
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  provider: ^6.1.1
  url_launcher: ^6.2.4
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/data/
